<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Esthers Beauty Parlour — Stock &amp; Till</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2B2722">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Esthers EBP">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --gold:#B8924A; --gold-hover:#A17E3A; --gold-money:#9C7A1F; --gold-money-hover:#7F6419; --ink:#3D3038; --steel:#8A7A80; --concrete:#FFFEFA; --panel:#FFFFFF; --blush:#F7EAE7; --blush-deep:#F1DCD9; --line:#EFE1D8; --good:#2E7D46; --bad:#C13B2A; --warn:#B6790A; --radius:14px; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--concrete);color:var(--ink);font-family:'Inter',sans-serif;}
  h1,h2,h3{font-family:'Playfair Display',serif;font-weight:600;letter-spacing:.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .hazard{height:4px;background:linear-gradient(90deg,var(--gold-hover),var(--gold),var(--blush-deep),var(--gold));}
  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(160deg,var(--blush) 0%,#FFFEFA 55%);color:var(--ink);padding:24px;}
  #login-screen .hazard{position:fixed;top:0;left:0;right:0;}
  .brand-logo{width:100%;max-width:280px;height:auto;margin-bottom:6px;}
  .brand-sub{color:var(--steel);font-size:12.5px;letter-spacing:.2em;margin-bottom:28px;text-transform:uppercase;}
  .login-card{background:#fff;border:1px solid var(--line);box-shadow:0 10px 34px rgba(184,146,74,.14);border-radius:20px;padding:30px;width:100%;max-width:360px;}
  .login-card label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--steel);margin:14px 0 6px;}
  .login-card select, .login-card input{width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--line);background:#FCFAF6;color:var(--ink);font-size:15px;font-family:inherit;}
  .login-card .hint{color:var(--steel);font-size:11.5px;margin-top:6px;}
  .btn{cursor:pointer;border:none;border-radius:999px;padding:11px 20px;font-family:'Inter',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:12.5px;font-weight:700;transition:.15s;}
  .btn-yellow{background:var(--gold);color:#fff;} .btn-yellow:hover{background:var(--gold-hover);}
  .btn-money{background:var(--gold-money);color:#fff;} .btn-money:hover{background:var(--gold-money-hover);}
  .btn-outline{background:transparent;border:1px solid var(--line);color:var(--ink);}
  .btn-outline:hover{border-color:var(--gold);color:var(--gold-money);}
  .btn-danger{background:var(--bad);color:#fff;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  #login-btn{width:100%;margin-top:22px;padding:13px;}
  #login-err{color:var(--bad);font-size:13px;margin-top:10px;min-height:16px;}
  .apicfg{margin-top:22px;font-size:11px;color:var(--steel);text-align:center;cursor:pointer;text-decoration:underline;}
  #app{display:none;min-height:100vh;grid-template-columns:230px 1fr;}
  #app.show{display:grid;}
  #sidebar{background:#fff;border-right:1px solid var(--line);color:var(--ink);padding:22px 0;display:flex;flex-direction:column;}
  #sidebar .brand2-logo{display:block;width:150px;height:auto;margin:0 auto 4px;}
  #sidebar .brand2-sub{padding:0 22px;color:var(--steel);font-size:10px;letter-spacing:.18em;margin-bottom:22px;text-transform:uppercase;text-align:center;}
  #sidebar nav{flex:1;}
  #sidebar button.navlink{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:var(--steel);padding:11px 22px;font-family:'Inter',sans-serif;font-weight:600;text-transform:uppercase;font-size:12px;letter-spacing:.04em;cursor:pointer;border-left:3px solid transparent;}
  #sidebar button.navlink:hover{color:var(--ink);background:var(--blush);}
  #sidebar button.navlink.active{color:var(--gold-money);border-left-color:var(--gold);background:var(--blush);}
  #sidebar button.navlink .cnt{margin-left:auto;background:var(--bad);color:#fff;font-size:10px;border-radius:10px;padding:1px 6px;}
  #sidebar .who{padding:16px 22px;border-top:1px solid var(--line);font-size:12px;color:var(--steel);}
  #sidebar .who b{color:var(--ink);display:block;font-size:14px;}
  #sidebar .who .wid{font-family:'IBM Plex Mono',monospace;color:var(--steel);}
  #sidebar .branchswitch{margin:8px 22px 0;}
  #sidebar .branchswitch select{width:100%;background:#FCFAF6;color:var(--ink);border:1px solid var(--gold);font-size:12px;padding:7px 9px;border-radius:10px;}
  #sidebar .logout{margin:12px 22px 0;font-size:11px;color:var(--bad);background:none;border:none;cursor:pointer;text-transform:uppercase;letter-spacing:.08em;padding:0;font-weight:700;}
  #main{padding:28px 34px;overflow-x:hidden;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
  .topbar h1{font-size:27px;margin:0;color:var(--ink);}
  .topbar .branchtag{background:var(--blush);color:var(--gold-money);font-size:11px;padding:5px 12px;border-radius:999px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:26px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:17px 19px;position:relative;overflow:hidden;box-shadow:0 3px 14px rgba(184,146,74,.05);}
  .card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--gold);}
  .card .label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--steel);margin-bottom:6px;}
  .card .val{font-family:'Playfair Display',serif;font-size:27px;font-weight:600;}
  .card.bad:before{background:var(--bad);} .card.bad .val{color:var(--bad);}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:20px;box-shadow:0 3px 14px rgba(184,146,74,.05);}
  .panel h3{font-size:16px;margin:0 0 14px;color:var(--gold-money);}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-family:'Inter',sans-serif;font-weight:700;text-transform:uppercase;font-size:10.5px;letter-spacing:.05em;color:var(--steel);border-bottom:2px solid var(--blush-deep);padding:9px 10px;}
  td{padding:10px 10px;border-bottom:1px solid var(--line);}
  tr:hover td{background:var(--blush);}
  .tag{display:inline-block;font-size:10.5px;padding:2px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;}
  .tag.ok{background:#e4f3e8;color:var(--good);} .tag.low{background:#fdeeea;color:var(--bad);} .tag.cat{background:var(--blush);color:var(--gold-money);}
  .tag.pending{background:#fdf1d6;color:var(--warn);} .tag.confirmed{background:#e4f3e8;color:var(--good);} .tag.rejected{background:#fdeeea;color:var(--bad);}
  input, select, textarea{font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);}
  input:focus, select:focus, textarea:focus{outline:none;border-color:var(--gold);}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--steel);margin-bottom:5px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .pos-wrap{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start;}
  .pos-search{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .pos-search input{flex:1;min-width:160px;}
  .catchip{border:1px solid var(--line);background:#fff;padding:6px 13px;border-radius:999px;font-size:12px;cursor:pointer;text-transform:uppercase;letter-spacing:.03em;font-weight:600;color:var(--ink);}
  .catchip.active{background:var(--gold);color:#fff;border-color:var(--gold);}
  .prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px;max-height:560px;overflow-y:auto;padding-right:4px;}
  .prod-card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 10px;cursor:pointer;transition:.12s;}
  .prod-card:hover{border-color:var(--gold);box-shadow:0 4px 14px rgba(184,146,74,.15);transform:translateY(-1px);}
  .prod-card .pname{font-weight:600;font-size:11.5px;margin-bottom:3px;line-height:1.25;min-height:28px;}
  .prod-card .pattrs{font-size:10.5px;color:var(--steel);margin-bottom:2px;}
  .prod-card .psku{font-size:10.5px;color:var(--steel);font-family:'IBM Plex Mono',monospace;}
  .prod-card .pprice{font-family:'Playfair Display',serif;color:var(--gold-money);font-size:13.5px;font-weight:600;}
  .prod-card .pstock{font-size:10px;margin-top:2px;}
  .prod-card.nostock{opacity:.45;cursor:not-allowed;}
  .cart{background:#fff;border:1px solid var(--gold);color:var(--ink);border-radius:18px;padding:18px;position:sticky;top:16px;box-shadow:0 8px 26px rgba(184,146,74,.12);}
  .cart h3{color:var(--gold-money);margin:0 0 10px;font-size:17px;}
  .cart-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;gap:6px;}
  .cart-item .ci-name{flex:1;}
  .cart-item .ci-qty{display:flex;align-items:center;gap:6px;}
  .cart-item .ci-qty button{background:var(--blush);color:var(--gold-money);border:none;width:22px;height:22px;border-radius:999px;cursor:pointer;font-weight:700;}
  .cart-total{display:flex;justify-content:space-between;padding:14px 0 6px;font-family:'Playfair Display',serif;font-size:20px;border-top:2px solid var(--gold-money);margin-top:8px;color:var(--gold-money);}
  .cart-subline{display:flex;justify-content:space-between;font-size:12.5px;color:var(--steel);padding:2px 0;}
  .cart-empty{color:var(--steel);font-size:13px;padding:20px 0;text-align:center;}
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(61,48,56,.45);align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal-bg.show{display:flex;}
  .modal{background:#fff;border-radius:20px;padding:26px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(61,48,56,.25);}
  .modal h3{margin-top:0;color:var(--gold-money);}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
  .receipt{background:#fff;width:300px;padding:18px 16px;font-family:'IBM Plex Mono',monospace;font-size:12px;margin:0 auto;border-left:2px dashed var(--line);border-right:2px dashed var(--line);}
  .receipt .rhead{text-align:center;margin-bottom:10px;}
  .receipt .rhead .rb{font-family:'Playfair Display',serif;font-size:16px;color:var(--gold-money);letter-spacing:.02em;font-weight:600;}
  .receipt hr{border:none;border-top:1px dashed var(--line);margin:8px 0;}
  .receipt .rline{display:flex;justify-content:space-between;}
  .receipt .rseq{background:var(--gold);color:#fff;text-align:center;padding:4px 0;font-weight:600;margin:8px 0;letter-spacing:.05em;border-radius:6px;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .search-input{min-width:220px;}
  .empty-state{padding:40px 20px;text-align:center;color:var(--steel);}
  .badge-role{font-size:10px;padding:2px 8px;border-radius:999px;background:var(--blush);color:var(--gold-money);text-transform:uppercase;letter-spacing:.04em;font-weight:700;}
  .toast{position:fixed;bottom:20px;right:20px;background:#fff;color:var(--ink);padding:13px 18px;border-radius:14px;font-size:13px;z-index:100;border-left:4px solid var(--gold);box-shadow:0 8px 24px rgba(61,48,56,.18);display:none;max-width:320px;}
  .conn-badge{position:fixed;top:12px;right:16px;z-index:60;font-size:10.5px;padding:4px 11px;border-radius:20px;font-family:'Inter',sans-serif;text-transform:uppercase;letter-spacing:.05em;font-weight:700;box-shadow:0 1px 5px rgba(184,146,74,.18);transition:.15s;}
  .conn-badge.online{background:#e4f3e8;color:var(--good);}
  .conn-badge.offline{background:#fdeeea;color:var(--bad);}
  .conn-badge.syncing{background:#fdf1d6;color:var(--warn);}
  .pay-toggle{display:flex;gap:8px;margin-bottom:12px;}
  .pay-toggle button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;}
  .pay-toggle button.active{background:var(--gold);color:#fff;border-color:var(--gold);}
  .note-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .note-btns button{background:var(--blush);border:1px solid var(--line);color:var(--gold-money);border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer;font-weight:700;}
  .freebie-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12.5px;}
  ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:var(--blush-deep);border-radius:4px;}

  /* ---------- RESPONSIVE ---------- */
  @media(max-width:840px){
    #app.show{display:block;}
    #sidebar{position:sticky;top:0;z-index:20;padding:8px 0;}
    #sidebar nav{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;}
    #sidebar button.navlink{border-left:none;border-bottom:3px solid transparent;white-space:nowrap;padding:12px 14px;}
    #sidebar button.navlink.active{border-bottom-color:var(--gold);}
    #sidebar .who,#sidebar .brand2,#sidebar .brand2-sub,#sidebar .branchswitch{display:none;}
    #main{padding:18px 16px;}
    .pos-wrap{grid-template-columns:1fr;}
    .cart{position:static;}
    .panel{overflow-x:auto;-webkit-overflow-scrolling:touch;}
    table{min-width:640px;}
  }
  @media(max-width:640px){
    body{-webkit-text-size-adjust:100%;}
    .conn-badge{top:auto;bottom:14px;right:14px;font-size:10px;padding:4px 10px;}
    .brand-logo{max-width:200px;}
    .login-card{padding:20px;max-width:100%;}
    #login-screen{padding:16px;}
    .topbar{margin-bottom:16px;}
    .topbar h1{font-size:20px;}
    .cards{grid-template-columns:1fr 1fr;gap:10px;}
    .card{padding:13px 14px;}
    .card .val{font-size:22px;}
    .prod-grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));max-height:none;gap:6px;}
    .prod-card{padding:10px;}
    .prod-card .pname{min-height:auto;font-size:12.5px;}
    .cart-item .ci-qty button{width:28px;height:28px;font-size:15px;}
    .row2,.row3{grid-template-columns:1fr;}
    .modal-bg{padding:0;align-items:flex-end;}
    .modal{max-width:100%;width:100%;border-radius:18px 18px 0 0;max-height:92vh;padding:20px 18px calc(20px + env(safe-area-inset-bottom));}
    .toast{left:14px;right:14px;bottom:70px;max-width:none;}
    .toolbar{flex-direction:column;align-items:stretch;}
    .search-input{min-width:0;width:100%;}
    #sidebar button.navlink{padding:11px 12px;font-size:11.5px;}
  }
  @media(min-width:1400px){
    #main{padding:32px 48px;}
    .prod-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));}
  }
</style>
</head>
<body>

<div id="conn-status" class="conn-badge"></div>

<div id="login-screen">
  <div class="hazard"></div>
  <img src="logo-full.png" alt="Esther's Beauty Parlour — A Queen's Beauty" class="brand-logo">
  <div class="brand-sub">Wigs &amp; Hair · Stock &amp; Till Control</div>
  <div class="login-card">
    <label>Work ID</label>
    <input id="login-workid" placeholder="e.g. EBP-002" autocomplete="off">
    <label>Full Name</label>
    <input id="login-name" placeholder="As assigned by your Administrator" autocomplete="off">
    <div class="hint">Your Work ID and Name are set up by your Administrator or Branch Manager.</div>
    <div id="login-err"></div>
    <button class="btn btn-yellow" id="login-btn">Log In</button>
  </div>
  <div class="apicfg" id="apicfg-toggle">Server: <span id="apicfg-val" class="mono"></span> (change)</div>
</div>

<div id="app">
  <div id="sidebar">
    <img src="logo-emblem.png" alt="Esther's Beauty Parlour" class="brand2-logo">
    <div class="brand2-sub">Stock &amp; Till</div>
    <nav id="navlinks"></nav>
    <div class="branchswitch" id="branchswitch-wrap" style="display:none;"><select id="branchswitch"></select></div>
    <div class="who"><b id="who-name"></b><span class="wid" id="who-id"></span><br><span id="who-role"></span> · <span id="who-branch"></span></div>
    <button class="logout" id="backup-btn" style="display:none;color:var(--gold);margin-top:8px;">⬇ Download Backup</button>
    <button class="logout" id="logout-btn">Log Out</button>
  </div>
  <div id="main"></div>
</div>

<div class="modal-bg" id="modal-bg"><div class="modal" id="modal-body"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
const UNITS = ["piece","pack","bundle","set","box","unit","session"];
const NOTE_SIZES = [1,2,5,10,20,50,100];

let API_BASE = localStorage.getItem('ebp_api_base') || window.location.origin;
document.getElementById('apicfg-val').textContent = API_BASE;
document.getElementById('apicfg-toggle').onclick = () => {
  const v = prompt('Backend server URL:', API_BASE);
  if (v) { API_BASE = v.replace(/\/$/, ''); localStorage.setItem('ebp_api_base', API_BASE); document.getElementById('apicfg-val').textContent = API_BASE; }
};

let session = null;         // {employeeId, workId, name, role, branchId, isAdmin}
let CACHE = { branches: [], employees: [], products: [], stock: {}, stockRequests: [], audit: [], categories: [], returns: [], settings: {fxCurrency:'ZiG', fxRate:0} };
let posCart = [];
let posCategory = "All";
let currentTab = "dashboard";
let loginFails = 0;
let pendingSales = JSON.parse(localStorage.getItem('ebp_pending_sales') || '[]');
let syncingSales = false;
let checkoutState = { discount: 0, paymentMethod: 'Cash', amountReceived: null, currency: 'USD' };

function money(n){ return "$" + Number(n||0).toFixed(2); }
function fmtDT(d){ d=new Date(d); return d.toLocaleDateString() + " " + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.style.display='block'; clearTimeout(t._h); t._h = setTimeout(()=> t.style.display='none', 3500); }

/* ---------------- OFFLINE SUPPORT ---------------- */
function savePendingSales(){ localStorage.setItem('ebp_pending_sales', JSON.stringify(pendingSales)); }
function saveOfflineCache(){ try { localStorage.setItem('ebp_offline_cache', JSON.stringify({ session, CACHE, savedAt: Date.now() })); } catch(e){} }
function loadOfflineCache(){
  try {
    const raw = localStorage.getItem('ebp_offline_cache');
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d.CACHE) return false;
    CACHE = d.CACHE;
    return true;
  } catch(e){ return false; }
}
function setConnBadge(state, text){
  const el = document.getElementById('conn-status'); if(!el) return;
  el.className = 'conn-badge ' + state;
  el.textContent = text;
}
function updateConnStatus(){
  const online = navigator.onLine;
  const pend = pendingSales.length;
  if (!online) setConnBadge('offline', pend ? `Offline · ${pend} pending sale${pend>1?'s':''}` : 'Offline — using saved data');
  else if (pend) setConnBadge('syncing', `Syncing ${pend} sale${pend>1?'s':''}…`);
  else setConnBadge('online', 'Online');
}
function queueOfflineSale(items, saleBody){
  saleBody = saleBody || { branchId: session.branchId, employeeId: session.employeeId, items, discount:0, paymentMethod:'Cash', amountReceived:null, currency:'USD' };
  const subtotal = items.reduce((a,it)=>a + (it.isFreebie?0:it.price*it.qty), 0);
  const discount = Math.min(subtotal, saleBody.discount||0);
  const total = Math.max(0, subtotal - discount);
  const seq = 'OFFLINE-' + String(pendingSales.length+1).padStart(4,'0');
  let changeDue = null;
  if (saleBody.paymentMethod==='Cash' && saleBody.amountReceived!=null) {
    const fx = CACHE.settings || {fxRate:0};
    const receivedUsd = (saleBody.currency==='LOCAL' && fx.fxRate>0) ? saleBody.amountReceived / fx.fxRate : saleBody.amountReceived;
    changeDue = receivedUsd - total;
  }
  const saleRecord = Object.assign({}, saleBody, { localId:'off_'+Math.random().toString(36).slice(2,10), total, subtotal, discount, changeDue, timestamp: Date.now(), seq });
  pendingSales.push(saleRecord); savePendingSales();
  items.forEach(it=>{ const p = CACHE.products.find(x=>x.id===it.productId); if (p && !p.isService) CACHE.stock[it.productId] = Math.max(0,(CACHE.stock[it.productId]||0) - it.qty); });
  saveOfflineCache();
  posCart = []; checkoutState = { discount:0, paymentMethod:'Cash', amountReceived:null, currency:'USD' };
  showReceipt(saleRecord, true);
  if (currentTab==='pos') { document.getElementById('main').innerHTML = renderPOS(); bindPOS(); }
  updateConnStatus();
  toast('No connection — sale saved on this device and will sync automatically once you\'re back online.');
}
async function syncPendingSales(){
  if (pendingSales.length===0 || !navigator.onLine || !session || syncingSales) return;
  syncingSales = true;
  updateConnStatus();
  const toSync = [...pendingSales];
  for (const s of toSync) {
    try {
      await api('/api/sales', { method:'POST', body:{ branchId:s.branchId, employeeId:s.employeeId, items:s.items, discount:s.discount, paymentMethod:s.paymentMethod, amountReceived:s.amountReceived, currency:s.currency } });
      pendingSales = pendingSales.filter(p=>p.localId!==s.localId);
      savePendingSales();
    } catch(e){ break; } // stop at first failure, keep the rest queued for next attempt
  }
  syncingSales = false;
  try { await refreshCache(); renderNav(); render(); } catch(e){}
  updateConnStatus();
  if (pendingSales.length===0 && toSync.length>0) toast('All offline sales have synced.');
}
window.addEventListener('online', ()=>{ updateConnStatus(); syncPendingSales(); });
window.addEventListener('offline', updateConnStatus);

async function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if (opts.body && typeof opts.body !== 'string') opts.body = JSON.stringify(opts.body);
  let res;
  try { res = await fetch(API_BASE + path, opts); }
  catch(e){ toast('Cannot reach server at ' + API_BASE + '. Check the server URL and that the backend is running.'); throw e; }
  let data = null;
  try { data = await res.json(); } catch(e) {}
  if (!res.ok) { const msg = (data && data.error) || ('Request failed (' + res.status + ')'); toast(msg); throw new Error(msg); }
  return data;
}

function pendingCount(){ return CACHE.stockRequests.filter(r=>r.status==='pending').length; }

const TABS = [
  {id:'dashboard', label:'Dashboard'}, {id:'pos', label:'Sales Till'}, {id:'inventory', label:'Inventory'},
  {id:'returns', label:'Returns'}, {id:'reports', label:'Reports'},
  {id:'confirm', label:'Stock Confirmations'}, {id:'employees', label:'Employees'}, {id:'branches', label:'Branches'}, {id:'audit', label:'Accountability Log'},
];
async function refreshCache(){
  if (!navigator.onLine) { updateConnStatus(); loadOfflineCache(); return; }
  try {
    const [branches, employees, products, categories, settings] = await Promise.all([
      api('/api/branches'), api('/api/employees'), api('/api/products'), api('/api/categories'), api('/api/settings')
    ]);
    CACHE.branches = branches; CACHE.employees = employees; CACHE.products = products; CACHE.categories = categories; CACHE.settings = settings;
    const [stock, stockRequests, audit, returns] = await Promise.all([
      api('/api/stock?branchId=' + encodeURIComponent(session.branchId)),
      api('/api/stock-requests?' + (session.isAdmin ? 'all=1' : ('branchId=' + encodeURIComponent(session.branchId)))),
      api('/api/audit?' + (session.isAdmin ? 'all=1' : ('branchId=' + encodeURIComponent(session.branchId)))),
      api('/api/returns?' + (session.isAdmin ? 'all=1' : ('branchId=' + encodeURIComponent(session.branchId)))),
    ]);
    CACHE.stock = stock; CACHE.stockRequests = stockRequests; CACHE.audit = audit; CACHE.returns = returns;
    saveOfflineCache();
    updateConnStatus();
    if (pendingSales.length) syncPendingSales();
  } catch(e) {
    updateConnStatus();
    if (!loadOfflineCache()) throw e;
  }
}
async function enterApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').classList.add('show');
  try { await refreshCache(); }
  catch(e){ toast('Could not reach the server and no saved data is available on this device yet. Connect once to load your data offline-ready.'); }

function posFilteredProducts(){

    else { if (p.isFreebieOnly) return false; }
    if(posCategory!=='All' && p.category!==posCategory) return false;
    if(q && !(p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q))) return false;
    return true;
  });
}
function renderProdGrid(){
  const stock = CACHE.stock || {};
  const grid = document.getElementById('prod-grid'); if(!grid) return;
  const items = posFilteredProducts();
  grid.innerHTML = items.map(p=>{
    const q = stock[p.id]||0;
    const noStock = !p.isService && q<=0;
    const stockLine = p.isService
      ? `<span style="color:var(--gold-money);">Service</span>`
      : `<span style="color:${q<=p.reorderLevel?'var(--bad)':'var(--steel)'}">${q} left</span>`;
    return `<div class="prod-card ${noStock?'nostock':''}" data-id="${p.id}">
      <div class="pname">${p.name}</div>
      <div class="pprice">${money(p.price)}</div>
      <div class="pstock">${stockLine}</div>
    </div>`;
  }).join('') || `<div class="empty-state">${freebieMode ? 'No freebie items yet — mark one as a freebie in Inventory first.' : 'No products match.'}</div>`;
  grid.querySelectorAll('.prod-card').forEach(el=> el.onclick = ()=>{ if(!el.classList.contains('nostock')) addToCart(el.dataset.id); });

function addToCart(prodId){
  const stock = CACHE.stock || {};
  const p = CACHE.products.find(x=>x.id===prodId);
  if (freebieMode || p.isFreebieOnly) {
    const existing = posCart.find(c=>c.productId===prodId && c.isFreebie);
    if (existing) existing.qty += 1; else posCart.push({productId:prodId, qty:1, price:p.price, isFreebie:true});
    toast(`${p.name} added as a freebie.`);
    renderCart();
    return;
  }
  const existing = posCart.find(c=>c.productId===prodId && !c.isFreebie);
  const inCart = existing ? existing.qty : 0;
  if (!p.isService && inCart + 1 > (stock[prodId]||0)) return;
  if (existing) existing.qty += 1; else posCart.push({productId:prodId, qty:1, price:p.price, isFreebie:false});
  renderCart();
}
function cartMath(){
  const subtotal = posCart.reduce((a,c)=> a + (c.isFreebie ? 0 : c.price*c.qty), 0);
  const discount = Math.min(subtotal, checkoutState.discount||0);
  const total = Math.max(0, subtotal - discount);
  let changeDue = null;
  if (checkoutState.paymentMethod==='Cash' && checkoutState.amountReceived != null) {
    const fx = CACHE.settings || {fxRate:0};
    const receivedUsd = (checkoutState.currency==='LOCAL' && fx.fxRate>0) ? checkoutState.amountReceived / fx.fxRate : checkoutState.amountReceived;
    changeDue = receivedUsd - total;
  }
  return { subtotal, discount, total, changeDue };
}
function renderCart(){
  const stock = CACHE.stock || {};
  const box = document.getElementById('cart-items'); if(!box) return;
  box.innerHTML = posCart.length===0 ? '<div class="cart-empty">Cart is empty — tap a product to add it.</div>' :
    posCart.map((c,idx)=>{
      const p = CACHE.products.find(x=>x.id===c.productId);
      if (c.isFreebie) {
        return `<div class="freebie-row"><span>🎁 ${p.name} × ${c.qty} <span style="color:var(--gold-money);font-weight:700;">FREE</span></span>
          <button data-act="rm" data-idx="${idx}" style="background:var(--blush);border:none;color:var(--bad);border-radius:999px;width:20px;height:20px;cursor:pointer;">×</button></div>`;
      }
      return `<div class="cart-item"><div class="ci-name">${p.name}<br><span style="color:var(--steel)">${money(c.price)} × ${c.qty} ${p.unit}</span></div>
        <div class="ci-qty"><button data-act="dec" data-idx="${idx}">−</button><span>${c.qty}</span><button data-act="inc" data-idx="${idx}">+</button><button data-act="rm" data-idx="${idx}" style="background:#fdeeea;color:var(--bad);">×</button></div></div>`;
    }).join('');
  const { subtotal, discount, total, changeDue } = cartMath();
  document.getElementById('cart-subtotal-val').textContent = money(subtotal);
  document.getElementById('cart-discount-val').textContent = discount ? '−' + money(discount) : money(0);
  document.getElementById('cart-total-val').textContent = money(total);
  const changeEl = document.getElementById('cart-change-val');
  if (changeEl) changeEl.textContent = changeDue==null ? '—' : (changeDue<0 ? 'Short ' + money(-changeDue) : money(changeDue));
  if (changeEl) changeEl.style.color = (changeDue!=null && changeDue<0) ? 'var(--bad)' : 'var(--gold-money)';
  box.querySelectorAll('button').forEach(btn=> btn.onclick = ()=>{
    const idx = Number(btn.dataset.idx), act = btn.dataset.act, item = posCart[idx];
    const p = CACHE.products.find(x=>x.id===item.productId);
    if(act==='inc'){ if(p.isService || item.isFreebie || item.qty+1 <= (stock[item.productId]||0)) item.qty+=1; }
    else if(act==='dec'){ item.qty-=1; if(item.qty<=0) posCart.splice(idx,1); }
    else if(act==='rm'){ posCart.splice(idx,1); }
    renderCart(); renderProdGrid();
  });
}

function renderNoteBtns(){
  const wrap = document.getElementById('note-btns'); if (!wrap) return;
  if (checkoutState.currency !== 'USD') { wrap.innerHTML = ''; return; }
  wrap.innerHTML = NOTE_SIZES.map(n=>`<button data-note="${n}">$${n}</button>`).join('') + `<button data-note="clear" style="color:var(--bad);">Clear</button>`;
  wrap.querySelectorAll('button').forEach(b=> b.onclick = ()=>{

    else { checkoutState.amountReceived = (checkoutState.amountReceived||0) + Number(b.dataset.note); }
    document.getElementById('pos-received').value = checkoutState.amountReceived;
    renderCart();
  });

async function doCheckout(){
  if (posCart.length===0) return;
  const { discount, total, changeDue } = cartMath();
  if (checkoutState.paymentMethod==='Cash' && checkoutState.amountReceived!=null && changeDue!=null && changeDue<0) {
    toast('Amount received is less than the total — check the amount before checking out.'); return;
  }
  const items = posCart.map(c=>({productId:c.productId, qty:c.qty, price:c.price, isFreebie:!!c.isFreebie}));
  const saleBody = { branchId: session.branchId, employeeId: session.employeeId, items, discount,
    paymentMethod: checkoutState.paymentMethod, amountReceived: checkoutState.amountReceived, currency: checkoutState.currency };
  if (!navigator.onLine) { queueOfflineSale(items, saleBody); return; }
  try {
    const sale = await api('/api/sales', { method:'POST', body: saleBody });
    posCart = []; checkoutState = { discount:0, paymentMethod:'Cash', amountReceived:null, currency:'USD' };
    await refreshCache(); showReceipt(sale); document.getElementById('main').innerHTML = renderPOS(); bindPOS(); renderNav();
  } catch(e){
    if (e instanceof TypeError) queueOfflineSale(items, saleBody); // network unreachable, not a server-side rejection
  }
}
function showReceipt(sale, offline){
  const items = sale.items.map(c=>{ const p = CACHE.products.find(x=>x.id===c.productId); const label = c.isFreebie ? 'FREE' : money(c.price*c.qty);
    return `<div class="rline"><span>${p?p.name:c.productId} x${c.qty}${p?p.unit:''}${c.isFreebie?' 🎁':''}</span><span>${label}</span></div>`; }).join('');
  const fx = CACHE.settings || {fxCurrency:'ZiG', fxRate:0};
  openModal(`<div class="receipt"><div class="rhead"><div class="rb">ESTHERS BEAUTY PARLOUR</div><div>${branchName(session.branchId)}</div></div>
      <div class="rseq">${sale.seq}</div>
      ${offline?'<div style="text-align:center;color:var(--bad);font-weight:700;margin:6px 0 2px;letter-spacing:.04em;">OFFLINE — PENDING SYNC</div>':''}
      <div class="rline"><span>Date</span><span>${fmtDT(sale.timestamp)}</span></div>
      <div class="rline"><span>Served by</span><span>${session.name}</span></div><hr>${items}<hr>
      ${sale.discount ? `<div class="rline"><span>Subtotal</span><span>${money(sale.subtotal!=null?sale.subtotal:(sale.total+sale.discount))}</span></div><div class="rline"><span>Discount</span><span>−${money(sale.discount)}</span></div>` : ''}
      <div class="rline" style="font-weight:700;font-size:14px;color:var(--gold-money);"><span>TOTAL</span><span>${money(sale.total)}</span></div>
      ${fx.fxRate>0 ? `<div class="rline" style="color:var(--steel);font-size:11px;"><span>≈ ${fx.fxCurrency}</span><span>${(sale.total*fx.fxRate).toFixed(2)}</span></div>` : ''}
      <div class="rline"><span>Payment</span><span>${sale.paymentMethod||'Cash'}</span></div>
      ${sale.paymentMethod==='Cash' && sale.amountReceived!=null ? `<div class="rline"><span>Received</span><span>${sale.currency==='LOCAL'?fx.fxCurrency+' ':''}${Number(sale.amountReceived).toFixed(2)}</span></div>
      <div class="rline"><span>Change</span><span>${money(sale.changeDue||0)}</span></div>` : ''}
      <hr><div style="text-align:center;color:var(--steel);margin-top:6px;">${offline?'Saved on this device — will sync automatically once online.':'Thank you for shopping with us'}</div></div>
    <div class="modal-actions"><button class="btn btn-outline" id="close-receipt">Close</button><button class="btn btn-yellow" onclick="window.print()">Print</button></div>`);
  document.getElementById('close-receipt').onclick = closeModal;
}

async function bindReports(){
  document.querySelectorAll('[data-period]').forEach(c=> c.onclick = ()=>{ reportPeriod = c.dataset.period; document.getElementById('main').innerHTML = renderReports(); bindReports(); });
  let rows = [];
  try {
    rows = await api('/api/reports/sales?' + (session.isAdmin ? 'all=1' : ('branchId=' + encodeURIComponent(session.branchId))) + '&period=' + reportPeriod);
  } catch(e){ rows = []; }
  const labels = rows.map(r=>r.label);
  const totals = rows.map(r=>r.total||0);
  document.getElementById('report-table').innerHTML = rows.length ? `<table><thead><tr><th>Period</th><th>Sales</th><th>Total</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td>${r.label}</td><td>${r.count}</td><td>${money(r.total)}</td></tr>`).join('')}</tbody></table>`
    : '<p class="empty-state">No sales recorded in this period yet.</p>';
  const canvas = document.getElementById('report-chart');
  if (!canvas || typeof Chart === 'undefined') return;
  if (window._reportChartInstance) window._reportChartInstance.destroy();
  window._reportChartInstance = new Chart(canvas.getContext('2d'), {
    type: 'bar',
    data: { labels, datasets: [{ label: 'Sales ($)', data: totals, backgroundColor: '#B8924A', borderRadius: 6, maxBarThickness: 42 }] },
    options: { responsive:true, plugins:{ legend:{ display:false } }, scales:{ y:{ beginAtZero:true, ticks:{ callback:(v)=>'$'+v } } } }
  });
}

/* ---------------- AUDIT ---------------- */
function renderAudit(){
  return `<div class="topbar"><h1>Accountability Log</h1><span class="branchtag">${branchName(session.branchId)}</span></div>
  <div class="panel"><table><thead><tr><th>Time</th><th>Branch</th><th>Employee</th><th>Action</th><th>Details</th></tr></thead>
    <tbody>${CACHE.audit.map(a=>`<tr><td>${fmtDT(a.timestamp)}</td><td>${branchName(a.branchId)}</td><td>${empName(a.employeeId)}</td><td>${a.action}</td><td>${a.details}</td></tr>`).join('') || '<tr><td colspan="5" class="empty-state">No activity recorded yet.</td></tr>'}</tbody></table></div>`;
}

/* ---------------- MODAL ---------------- */
function openModal(html){ document.getElementById('modal-body').innerHTML = html; document.getElementById('modal-bg').classList.add('show'); }
function closeModal(){ document.getElementById('modal-bg').classList.remove('show'); }
document.getElementById('modal-bg').addEventListener('click', (e)=>{ if(e.target.id==='modal-bg') closeModal(); });

/* ---------------- INIT ---------------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch((err)=>console.warn('SW registration failed', err)); });
}
(async function init(){
  updateConnStatus();
  const saved = localStorage.getItem('ebp_session');
  if (saved) {
    try {
      session = JSON.parse(saved);
      await enterApp();
      return;
    } catch(e){ session = null; localStorage.removeItem('ebp_session'); }
  }
})();
</script>
</body>
</html>
